- title: Open Source Projects
  type: time_table
  contents:
    - title: <a href="https://github.com/an0wen/MARDIGRAS">MARDIGRAS</a>
      year: 2024 - pres.
      description: Mass-Radius DIaGRAm with Sliders (MARDIGRAS) is a visualization tool that allows simple and intuitive manipulation of mass-radius relationships (also known as iso-composition curves) using interactive sliders.
    - title: <a href="https://github.com/an0wen/mr-plotter">mr-plotter</a>
      year: 2026 - pres.
      description: mr-plotter is a user-friendly tool designed to produce paper-quality mass–radius diagrams based on a broad selection of state-of-the-art models of planetary interiors and atmospheres.

